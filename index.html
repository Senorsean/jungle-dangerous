<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JUNGLE DANGEROUS — Niveau 1 : La Jungle Dense</title>
<style>
  html,body{margin:0;padding:0;background:#2a0d0d;height:100%;width:100%;overflow:hidden;
    font-family:'Courier New',monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  /* le canvas ne dépend plus d'un conteneur flex : il se positionne lui-même */
  #cv{position:fixed;left:0;top:0;width:100%;height:100%;
    object-fit:contain;display:block;z-index:1;
    image-rendering:pixelated;image-rendering:crisp-edges;background:#5aa8c8}
  /* message visible tant que le JS n'a pas dessiné sa première image */
  #boot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:5;
    background:#12250f;color:#8ee06a;display:flex;align-items:center;justify-content:center;
    text-align:center;font:16px/1.6 monospace;padding:20px}
  .tbtn{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.12);
    border:3px solid rgba(255,255,255,.35);color:#fff;font-size:26px;font-weight:bold;
    display:none;align-items:center;justify-content:center;z-index:10;font-family:monospace}
  .tbtn:active{background:rgba(255,255,255,.35)}
  body.touch .tbtn{display:flex}
  #bL{left:16px;bottom:96px}#bR{left:104px;bottom:96px}
  #bJ{right:16px;bottom:110px}#bA{right:104px;bottom:40px}#bD{right:16px;bottom:210px;width:60px;height:60px;font-size:20px}
  #err{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;background:#140808;color:#ffb3a0;
    padding:22px;font:13px/1.5 monospace;overflow:auto;display:none;white-space:pre-wrap}
  #err b{color:#ffd23f;font-size:16px}
  #bU{position:fixed;right:104px;bottom:132px;width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.4);color:#fff;
    font:22px monospace;align-items:center;justify-content:center;z-index:10;display:none}
  #bM{position:fixed;right:12px;top:12px;width:42px;height:42px;border-radius:9px;
    background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);color:#fff;
    font:19px monospace;display:flex;align-items:center;justify-content:center;

<body>
<canvas id="cv" width="960" height="544"></canvas>
<div id="boot">Chargement de la jungle…<br><small>(si ce message reste, le script ne s'exécute pas)</small></div>
<div class="tbtn" id="bL">◀</div><div class="tbtn" id="bR">▶</div>
<div class="tbtn" id="bJ">▲</div><div class="tbtn" id="bA">🔨</div><div class="tbtn" id="bD">💣</div>
<div id="err"></div>
<div id="bM">🔊</div>
<div id="bU">⬆</div>
<script>
"use strict";
/* ---------- DIAGNOSTIC ----------
   Si quoi que ce soit casse, on l'affiche à l'écran au lieu d'une page noire. */
let ERRSHOWN=false;
function fail(where,e){
  if(ERRSHOWN)return; ERRSHOWN=true;
  const b=document.getElementById('boot'); if(b)b.style.display='none';
  const d=document.getElementById('err');
  const msg=(e&&e.message)||String(e);
  const st=(e&&e.stack)?e.stack.split('\n').slice(0,5).join('\n'):'(pas de pile)';
  d.innerHTML='<b>Le jeu a planté — envoie-moi cet écran</b>\n\n'+
    'Étape : '+where+'\nErreur : '+msg+'\n\n'+st+
    '\n\nNavigateur :\n'+navigator.userAgent;
  d.style.display='block';
}
window.onerror=function(m,src,l,c,e){fail('erreur globale ligne '+l,e||{message:m});};
window.addEventListener('unhandledrejection',ev=>fail('promesse',ev.reason));

/* ============================================================
   JUNGLE DANGEROUS v2 — DA 16-bit modernisée
   Contours de sprites, parallaxe 5 couches, lumière volumétrique,
   lucioles, ombres portées, vignettage, scanlines.
   ============================================================ */
const cv=document.getElementById('cv');
const ctx=cv&&cv.getContext?cv.getContext('2d'):null;
if(!ctx)fail('création du contexte 2D',{message:'Ce navigateur refuse le canvas 2D.'});
else ctx.imageSmoothingEnabled=false;
const TILE=32, VW=960, VH=544;

/* ============================================================
   MOTEUR AUDIO — tout est synthétisé, aucun fichier externe.
   Chaîne : voix -> MUSGAIN/SFXGAIN -> MASTER -> compresseur -> sortie
   ============================================================ */
let AC=null,MASTER=null,MUSGAIN=null,SFXGAIN=null,NOISEBUF=null,MUTED=false;
const MUSVOL=.42, SFXVOL=.9;

function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain();MASTER.gain.value=.85;
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-13;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.25;
      MASTER.connect(comp);comp.connect(AC.destination);
      MUSGAIN=AC.createGain();MUSGAIN.gain.value=MUTED?0:MUSVOL;MUSGAIN.connect(MASTER);
      SFXGAIN=AC.createGain();SFXGAIN.gain.value=MUTED?0:SFXVOL;SFXGAIN.connect(MASTER);
      /* 2 s de bruit blanc réutilisable : évite de reconstruire un buffer à chaque son */
      const n=Math.floor(AC.sampleRate*2);
      NOISEBUF=AC.createBuffer(1,n,AC.sampleRate);
      const ch=NOISEBUF.getChannelData(0);
      for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
      MUS.next=AC.currentTime+.08;
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
}
function setMute(m){
  MUTED=m;
  if(MUSGAIN)MUSGAIN.gain.value=MUTED?0:MUSVOL;
  if(SFXGAIN)SFXGAIN.gain.value=MUTED?0:SFXVOL;
  const b=document.getElementById('bM');if(b)b.textContent=MUTED?'🔇':'🔊';
}
function nf(m){return 440*Math.pow(2,(m-69)/12);}

/* --- briques de synthèse --- */
function vOsc(type,freq,t,dur,dest,vol,atk,rel,det){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;if(det)o.detune.value=det;
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+atk);
  g.gain.setValueAtTime(vol,t+Math.max(atk,dur-rel));
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
  return o;
}
function vNoise(t,dur,dest,vol,ftype,freq,q){
  const s=AC.createBufferSource();s.buffer=NOISEBUF;s.loop=true;
  const f=AC.createBiquadFilter();f.type=ftype||'highpass';
  f.frequency.value=freq||6000;f.Q.value=q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);
  s.start(t,Math.random()*1.4);s.stop(t+dur+.03);
  return f;
}
function lp(freq,q,dest){
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  if(q)f.Q.value=q;f.connect(dest);return f;
}

/* --- percussions --- */
function dKick(t,v){v=v||1;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(145,t);
  o.frequency.exponentialRampToValueAtTime(42,t+.12);
  g.gain.setValueAtTime(.85*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.19);
  o.connect(g);g.connect(MUSGAIN);o.start(t);o.stop(t+.21);
  vNoise(t,.03,MUSGAIN,.2*v,'lowpass',1100);
}
function dSnare(t,v){v=v||1;
  vNoise(t,.14,MUSGAIN,.3*v,'bandpass',1900,.9);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(215,t);
  o.frequency.exponentialRampToValueAtTime(140,t+.09);
  g.gain.setValueAtTime(.18*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
  o.connect(g);g.connect(MUSGAIN);o.start(t);o.stop(t+.12);
}
function dHat(t,v){vNoise(t,.035,MUSGAIN,.1*(v||1),'highpass',8200);}
function dShaker(t,v){vNoise(t,.055,MUSGAIN,.075*(v||1),'highpass',5200);}
function dTom(t,f,v){v=v||1;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(f*.55,t+.18);
  g.gain.setValueAtTime(.45*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(g);g.connect(MUSGAIN);o.start(t);o.stop(t+.24);
  vNoise(t,.05,MUSGAIN,.08*v,'bandpass',620,1.2);
}

/* --- voix mélodiques --- */
function mLead(t,midi,dur,v){
  const f=nf(midi),out=lp(2700,0,MUSGAIN);
  const o1=vOsc('square',f,t,dur,out,v,.008,.05,-6);
  const o2=vOsc('square',f,t,dur,out,v*.55,.008,.05,7);
  const lfo=AC.createOscillator(),lg=AC.createGain();
  lfo.frequency.value=5.4;lg.gain.value=6;
  lfo.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);
  lfo.start(t);lfo.stop(t+dur+.03);
}
function mBass(t,midi,dur,v){
  const out=lp(720,2,MUSGAIN);
  vOsc('triangle',nf(midi),t,dur,out,v,.006,.04,0);
  vOsc('square',nf(midi),t,dur,out,v*.4,.006,.04,0);
}
function mArp(t,midi,dur,v){vOsc('square',nf(midi),t,dur,lp(3300,0,MUSGAIN),v,.004,.03,0);}
function mPad(t,midi,dur,v){
  const out=lp(1300,0,MUSGAIN);
  vOsc('sawtooth',nf(midi),t,dur,out,v,.3,.5,-5);
  vOsc('sawtooth',nf(midi),t,dur,out,v,.3,.5,6);
}
function mMarimba(t,midi,dur,v){
  const out=lp(2400,0,MUSGAIN);
  vOsc('sine',nf(midi),t,dur,out,v,.003,.05,0);
  vOsc('sine',nf(midi+12),t,dur*.5,out,v*.35,.003,.04,0);
}

/* ============================================================
   PARTITION — La Marche de la Jungle, la mineur, 8 mesures
   ============================================================ */
const R=-1;
/* mélodie, 8 croches par mesure */
const M_LEAD=[
  69,R,72,R, 76,R,74,R,
  72,R,69,R, 71,R, R,R,
  65,R,69,R, 72,R,69,R,
  67,R,71,R, 74,R, R,R,
  76,R,76,R, 74,72,71,R,
  69,R, R,R, 64,R,67,R,
  65,R,67,R, 69,R,72,R,
  71,R,68,R, 64,R, R,R
];
const M_ROOT=[45,45,41,43,45,45,41,40];              /* Am Am F G Am Am F E */
const M_CHORD=[[57,60,64,60],[57,60,64,60],[53,57,60,57],[55,59,62,59],
               [57,60,64,60],[57,60,64,60],[53,57,60,57],[52,56,59,56]];
const BASSPAT=[0,R,0,R,7,R,0,R];

const MUS={on:true,track:'',step:0,next:0,bpm:132,s16:.11};

function musStep(s,t){
  const bar=(s/16)|0, inBar=s%16, eighth=(s/2)|0, half=s%2;
  const sp=MUS.s16, tr=MUS.track;

  if(tr==='level'||tr==='boss'){
    const boss=tr==='boss';
    /* batterie tribale */
    if(inBar===0||inBar===6||inBar===10)dKick(t);
    if(boss&&(inBar===3||inBar===13))dKick(t,.65);
    if(inBar===4||inBar===12)dSnare(t);
    if(inBar%2===0)dHat(t,inBar%4===0?1:.55);
    if(inBar%4===2)dShaker(t,.9);
    if((bar===3||bar===7)&&inBar>=13)dTom(t,[225,178,142][inBar-13],1);
    /* basse en croches */
    if(half===0){
      const p=BASSPAT[eighth%8];
      if(p>=0)mBass(t,M_ROOT[bar]+p-(boss?12:0),sp*1.7,boss?.26:.2);
    }
    /* arpège en doubles-croches */
    mArp(t,M_CHORD[bar][inBar%4],sp*.9,boss?.045:.06);
    /* mélodie en croches */
    if(half===0){
      const n=M_LEAD[eighth%64];
      if(n>0)mLead(t,boss?n-12:n,sp*1.9,boss?.13:.15);
    }
  }

  if(tr==='cave'){
    /* souterrain : marimba, nappe, percussions rares */
    if(inBar===0||inBar===8)dKick(t,.65);
    if(inBar===12)dSnare(t,.4);
    if(inBar%4===0)dShaker(t,.45);
    if((bar===3||bar===7)&&inBar===14)dTom(t,150,.8);
    if(half===0){
      const pp=BASSPAT[eighth%8];
      if(pp>=0)mBass(t,M_ROOT[bar]-12+pp,sp*2.3,.2);
    }
    if(inBar%8===0)mPad(t,M_CHORD[bar][0],sp*8,.05);
    if(inBar%2===0)mMarimba(t,M_CHORD[bar][((inBar/2)|0)%4]+12,sp*2.4,.07);
    if(half===0&&bar%2===0){
      const n=M_LEAD[eighth%64];
      if(n>0)mLead(t,n-12,sp*2.2,.085);
    }
  }
  if(tr==='title'){
    /* nappe + marimba, sans batterie : ambiance avant le départ */
    if(inBar===0)mPad(t,M_ROOT[bar]+12,sp*15,.05);
    if(inBar%2===0)mArp(t,M_CHORD[bar][((inBar/2)|0)%4]+12,sp*1.6,.05);
    if(inBar===0||inBar===6||inBar===10)mMarimba(t,M_CHORD[bar][0]+12,sp*3,.09);
    if(half===0&&bar%2===1){
      const n=M_LEAD[eighth%64];
      if(n>0)mLead(t,n,sp*1.8,.08);
    }
  }
}
/* ordonnanceur à anticipation : indépendant du framerate */
function musicTick(){
  if(!AC||!MUSGAIN||!MUS.track)return;
  MUS.s16=60/MUS.bpm/4;
  const look=AC.currentTime+.16;
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.04;
  let guard=0;
  while(MUS.next<look&&guard++<48){
    try{musStep(MUS.step,MUS.next);}catch(e){}
    MUS.step=(MUS.step+1)%128;
    MUS.next+=MUS.s16;
  }
}
function setTrack(name){
  if(MUS.track===name)return;
  MUS.track=name;MUS.step=0;
  MUS.bpm=name==='boss'?152:(name==='title'?100:(name==='cave'?112:132));
  if(AC)MUS.next=Math.max(AC.currentTime+.06,MUS.next);
}
/* atténue la musique pendant les gros bruitages */
function duck(amt,dur){
  if(!MUSGAIN||MUTED)return;
  const t=AC.currentTime,g=MUSGAIN.gain;
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(MUSVOL*amt,t+.02);
  g.linearRampToValueAtTime(MUSVOL,t+dur);
}

/* ============================================================
   BRUITAGES
   ============================================================ */
function tone(f,dur,type,v,slide){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(28,f+slide),t+dur);
  g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(SFXGAIN);o.start(t);o.stop(t+dur+.03);
}
function sn(dur,v,ftype,freq,q){if(AC)vNoise(AC.currentTime,dur,SFXGAIN,v,ftype,freq,q);}
function seq(notes,gap,dur,v,type){
  if(!AC)return;const t0=AC.currentTime;
  notes.forEach((n,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*gap;
    o.type=type||'square';o.frequency.value=nf(n);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(SFXGAIN);o.start(t);o.stop(t+dur+.03);
  });
}
const SFX={
  /* saut : woop montant + petit souffle de détente */
  jump:()=>{tone(230,.16,'square',.11,320);sn(.05,.06,'highpass',3000);},
  /* gemme : quinte cristalline */
  gem:()=>{seq([88,93],.055,.22,.11,'triangle');sn(.05,.04,'highpass',9000);},
  /* marteau : clang métallique, deux partiels + transitoire */
  hit:()=>{tone(196,.13,'sawtooth',.13,-80);tone(293,.09,'square',.07,-120);
    sn(.07,.14,'bandpass',2600,1.6);},
  /* dégât : chute dissonante */
  hurt:()=>{tone(320,.34,'sawtooth',.17,-250);sn(.2,.13,'lowpass',1400);duck(.55,.5);},
  /* explosion : souffle grave + coup de basse */
  boom:()=>{sn(.55,.34,'lowpass',900,.7);sn(.25,.16,'highpass',2000);
    tone(64,.5,'sine',.3,-34);duck(.35,.8);},
  /* ramassage dynamite */
  pick:()=>{seq([76,81],.06,.16,.1,'triangle');},
  /* rugissement : sciant, grave, avec grain */
  roar:()=>{tone(88,.62,'sawtooth',.2,-42);tone(132,.5,'square',.08,-38);
    sn(.42,.14,'lowpass',700,1.1);duck(.45,.85);},
  /* checkpoint : arpège majeur ascendant */
  check:()=>{seq([72,76,79,84],.075,.26,.1,'square');},
  /* victoire : fanfare */
  win:()=>{setTrack('');seq([69,72,76,81,84],.13,.42,.14,'square');
    setTimeout(()=>seq([76,81,88],.1,.7,.12,'triangle'),700);},
  /* game over : cadence descendante */
  over:()=>{setTrack('');seq([69,67,64,60,57],.17,.5,.15,'sawtooth');duck(.3,1.4);},
  /* pas : craquement d'herbe, pas un bip */
  step:()=>sn(.045,.05,'bandpass',1500,.8),
  /* accrochage : froissement de feuillage + corde qui se tend */
  grab:()=>{sn(.13,.11,'bandpass',1700,.7);tone(175,.11,'triangle',.07,95);},
  /* totem : carillon montant, la musique s'écarte un instant */
  idol:()=>{seq([72,76,79,84,88],.065,.45,.13,'triangle');
    sn(.35,.09,'highpass',6500);duck(.55,.9);},
  godwarn:()=>seq([84,84],.13,.12,.07,'square'),
  godend:()=>seq([84,79,72],.09,.22,.08,'square'),
  /* le bébé : couinements, pleurs et bruits peu distingués */
  babyCry:()=>{seq([76,72,67,64],.09,.3,.14,'square');sn(.35,.1,'bandpass',900,.8);duck(.5,.8);},
  babyRage:()=>{tone(150,.7,'sawtooth',.22,-60);seq([64,66,68],.1,.5,.12,'square');
    sn(.5,.16,'lowpass',700,.9);duck(.4,1);},
  babyTear:()=>{tone(880,.16,'triangle',.07,-260);},
  babyThrow:()=>{sn(.2,.1,'lowpass',900,.7);tone(260,.18,'triangle',.09,-120);},
  babyJump:()=>{tone(200,.22,'square',.11,420);sn(.1,.06,'highpass',2500);},
  babyLand:()=>{tone(70,.26,'sine',.24,-28);sn(.2,.14,'lowpass',600);},
  babyPoop:()=>{tone(120,.3,'sawtooth',.14,-70);sn(.3,.13,'lowpass',420,1.4);},
  /* fléchette : sifflement */
  dart:()=>{sn(.1,.09,'highpass',4500);tone(760,.09,'square',.05,-380);},
  /* lancer : whoosh */
  throw_:()=>{sn(.14,.08,'bandpass',900,.6);tone(300,.12,'triangle',.06,-140);},
};

/* ---------- NIVEAU ---------- */
let W=206,H=17,LEVEL=1,THEME=null;
let g=[];
function clearLevel(w,h){
  W=w;H=h;g=[];
  for(let y=0;y<h;y++)g.push(new Array(w).fill(0));
  gems.length=0;pickups.length=0;shooters.length=0;
  checks.length=0;spawns.length=0;vines.length=0;stals.length=0;idols.length=0;
}
function ground(x0,x1,top=14){for(let x=x0;x<=x1;x++)for(let y=top;y<H;y++)g[y][x]=1;}
function plat(x0,len,y){for(let x=x0;x<x0+len;x++)g[y][x]=1;}
function spikes(x0,x1,y=13){for(let x=x0;x<=x1;x++)g[y][x]=3;}
function crack(x,y){g[y][x]=4;}
const gems=[],pickups=[],shooters=[],checks=[],spawns=[],vines=[],stals=[],idols=[];
/* totem : rend l'héroïne intouchable pendant un temps limité */
function idol(x,y){idols.push({x:x*TILE+16,y:y*TILE+16,got:false});}
/* stalactite : se détache quand l'héroïne passe dessous */
function stal(x,y){stals.push({x:x*TILE+16,y:y*TILE,y0:y*TILE,vy:0,state:0,t:0});}
/* liane : ancrée en haut d'un tronc, longueur réglable, physique de pendule */
function vine(tx,ty,maxL,minL){vines.push({ax:tx*TILE+16,ay:ty*TILE,
  maxL:maxL,minL:minL||70,L:maxL,th:0,om:0,t:Math.random()*6,held:false});}
function gem(x,y){gems.push({x:x*TILE+16,y:y*TILE+16,t:Math.random()*6,got:false});}

function solid(t){return t===1||t===4;}
function tileAt(px,py){
  const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||tx>=W)return 1; if(ty<0)return 0; if(ty>=H)return 0;
  return g[ty][tx];
}
function rectHitsSolid(x,y,w,h){
  for(let px=x;px<x+w+TILE;px+=Math.min(TILE,w)){const cx=Math.min(px,x+w-0.01);
    for(let py=y;py<y+h+TILE;py+=Math.min(TILE,h)){const cy=Math.min(py,y+h-0.01);
      if(solid(tileAt(cx,cy)))return true;}}
  return false;
}
function emptyAt(tx,ty){if(tx<0||tx>=W||ty<0||ty>=H)return true;return !solid(g[ty][tx])&&g[ty][tx]!==5;}

/* ---------- MISE À JOUR ---------- */
/* ============================================================
   LIANES — pendule simple : a = -(g/L)*sin(theta)
   ============================================================ */
function vineHold(){
  const v=vines[P.vine];
  if(left())v.om-=0.0017;               /* pomper pour prendre de l'ampleur */
  if(right())v.om+=0.0017;
  if(climbUp()&&v.L>v.minL)v.L-=2.4;    /* grimper le long de la corde */
  if(down()&&v.L<v.maxL)v.L+=2.4;
  v.om+=-(0.42/v.L)*Math.sin(v.th);
  v.om*=0.994;
  v.om=Math.max(-.14,Math.min(.14,v.om));
  v.th+=v.om;
  P.x=v.ax+Math.sin(v.th)*v.L-P.w/2;
  P.y=v.ay+Math.cos(v.th)*v.L-10;
  P.vx=Math.cos(v.th)*v.L*v.om;         /* vitesse tangentielle */
  P.vy=-Math.sin(v.th)*v.L*v.om;
  P.onG=false;P.crouch=false;P.face=v.om>=0?1:-1;
  if(timer%9===0)puff(P.x+P.w/2,P.y+4,1,'#55a060',.7);
  /* si le balancier plaque l'héroïne contre un mur, elle lâche */
  if(rectHitsSolid(P.x,P.y,P.w,44)){
    let it=0;
    while(rectHitsSolid(P.x,P.y,P.w,44)&&it++<60)P.y-=1;   /* on la dégage vers le haut */
    releaseVine(0);return;
  }
  if(relKey()&&!prevS)releaseVine(1);
}
function releaseVine(boost){
  const v=vines[P.vine];
  v.held=false;P.vine=null;P.vgrabCD=14;
  if(boost){
    P.vy-=3.2;                          /* impulsion vers le haut au lâcher */
    P.vx=Math.max(-7.5,Math.min(7.5,P.vx*1.08));
    SFX.jump();
  }
}
function tryGrabVine(){
  const cx=P.x+P.w/2, cy=P.y+18;
  for(let i=0;i<vines.length;i++){
    const v=vines[i]; if(v.held)continue;
    const dx=cx-v.ax, dy=cy-v.ay;
    if(dy<24)continue;                  /* on ne s'accroche pas au-dessus de l'ancre */
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<v.minL-40||d>v.maxL+48)continue;
    const cl=Math.max(v.minL,Math.min(d,v.maxL));
    const rx=v.ax+Math.sin(v.th)*cl, ry=v.ay+Math.cos(v.th)*cl;
    if((cx-rx)*(cx-rx)+(cy-ry)*(cy-ry)>50*50)continue;
    P.vine=i;v.held=true;v.L=cl;v.th=Math.atan2(dx,dy);
    const den=v.L*Math.cos(v.th);
    v.om=den?Math.max(-.09,Math.min(.09,P.vx/den*.6)):0;
    SFX.grab();puff(cx,cy-14,5,'#55a060',1.4);
    return;
  }
}
/* balancement au repos, pour qu'elles restent vivantes et repérables */
function idleVines(){
  for(const v of vines){
    if(v.held)continue;
    v.t+=0.02;
    v.om+=-(0.42/v.L)*Math.sin(v.th);
    v.om*=0.985;
    v.om+=Math.sin(v.t)*0.00018;        /* souffle de vent, léger */
    v.th+=v.om;
  }
}

function updateBprojs(){
  for(const b of bprojs){
    if(b.kind==='tear'){
      b.vy+=0.34;b.x+=b.vx;b.y+=b.vy;b.t--;
      if(solid(tileAt(b.x,b.y+5))){b.gone=true;puff(b.x,b.y,3,'#7fd8ff',1.2);}
    }else if(b.kind==='teddy'){
      b.vy+=0.3;b.x+=b.vx;b.y+=b.vy;
      b.rot+=b.vx*0.05+0.12;b.t--;
      if(solid(tileAt(b.x,b.y+9))&&b.vy>0){    /* rebonds mous de peluche */
        b.bounces++;b.y-=3;
        b.vy=-Math.abs(b.vy)*.5;b.vx*=.75;
        puff(b.x,b.y+8,3,'#c8975a',1);
        if(b.bounces>=3)b.t=Math.min(b.t,26);  /* il s'immobilise puis disparaît */
      }
      if(solid(tileAt(b.x+10*Math.sign(b.vx),b.y)))b.vx*=-.6;
    }else if(b.kind==='poop'){
      if(!b.splat){
        b.vy+=0.42;b.x+=b.vx;b.y+=b.vy;
        if(solid(tileAt(b.x,b.y+10))){b.splat=1;b.t=110;b.vy=0;
          puff(b.x,b.y+8,8,'#6b4a22',1.6);}
      }else b.t--;
    }
    if(b.t<=0)b.gone=true;
    if(b.y>H*TILE+80)b.gone=true;
    /* contact avec l'héroïne */
    if(P.dead===0&&!b.gone){
      const ph=P.crouch?26:44, py=P.y+(P.crouch?18:0);
      const r=b.kind==='teddy'?15:(b.splat?16:10);
      if(Math.abs(b.x-(P.x+11))<11+r&&b.y>py-r&&b.y<py+ph+r){
        if(P.god>0){if(b.kind!=='poop'||!b.splat)b.gone=true;}
        else killPlayer();
      }
    }
  }
  bprojs=bprojs.filter(b=>!b.gone);
}
function updateStals(){
  for(const st of stals){
    if(st.state===0){
      if(P.dead===0&&Math.abs(P.x+11-st.x)<30&&P.y+22>st.y+40){
        st.state=1;st.t=24;sn(.16,.1,'bandpass',1400,1.2);
      }
    }else if(st.state===1){
      st.t--;if(st.t<=0)st.state=2;
    }else if(st.state===2){
      st.vy+=0.55;st.y+=st.vy;
      if(P.dead===0&&Math.abs(P.x+11-st.x)<20&&Math.abs(P.y+22-st.y-14)<30)killPlayer();
      if(solid(tileAt(st.x,st.y+30))||st.y>H*TILE+60){
        st.state=3;puff(st.x,st.y+24,12,'#9b8fb5',2.2);
        if(shake<6)shake=6;sn(.24,.16,'lowpass',800,.8);
      }
    }
  }
}
function bossAlive(){return ents.some(e=>e.isBoss&&!e.dead&&e.hp>0);}
function killPlayer(){
  if(P.inv>0||P.dead>0||P.god>0)return;
  if(P.vine!==null){vines[P.vine].held=false;P.vine=null;}
  P.dead=70;SFX.hurt();puff(P.x+P.w/2,P.y+P.h/2,14,'#c33');shake=10;
}
function hurtEnemy(e,dmg,kb){
  e.hp-=dmg;e.hurt=12;if(e.vx!==undefined)e.vx=kb*2;
  SFX.hit();puff(e.x+e.w/2,e.y+e.h/2,8,'#fff');
  if(e.type==='baby'&&e.hp>0){
    /* vexé : il fait un bond et lâche une couche pleine */
    if(e.onG){e.vy=-8.4;e.mode=3;e.mt=40;}
    bprojs.push({kind:'poop',x:e.x+e.w/2-kb*10,y:e.y+e.h-18,vx:-kb*1.4,vy:-2.2,t:260,splat:0});
    SFX.babyPoop();
  }
  if(e.hp<=0){
    puff(e.x+e.w/2,e.y+e.h/2,16,e.type==='trex'?'#8a6':'#d84');
    score+=(e.type==='trex'||e.type==='spino')?600:e.type==='stego'?150:100;
    if(e.type==='trex'||e.type==='spino'){SFX.roar();shake=16;setTrack(LEVEL===2?'cave':'level');}
    e.dead=true;
  }
}
function explode(x,y){
  SFX.boom();boomFX(x,y);
  for(const e of ents){if(e.dead)continue;
    const dx=(e.x+e.w/2)-x,dy=(e.y+e.h/2)-y;
    if(dx*dx+dy*dy<110*110)hurtEnemy(e,(e.type==='trex'||e.type==='spino')?3:5,Math.sign(dx));}
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  for(let ax=tx-2;ax<=tx+2;ax++)for(let ay=ty-2;ay<=ty+2;ay++){
    if(ax>=0&&ax<W&&ay>=0&&ay<H&&g[ay][ax]===4){g[ay][ax]=0;puff(ax*TILE+16,ay*TILE+16,10,'#987');}}
  const px=P.x+P.w/2-x,py=P.y+P.h/2-y;
  if(px*px+py*py<70*70)killPlayer();
}

  timer++;

  if(shake>0)shake--;

  if(P.dead>0){
    P.dead--;
    if(P.dead===0){
      lives--;
      if(lives<=0){state='over';SFX.over();return;}
      spawnPlayer();resetLevel(true);
      if(checks.some(c=>c.on))flash('REPRISE AU CHECKPOINT','#8ee06a');
    }
  }else{
    if(P.inv>0)P.inv--;
    if(P.god>0){
      P.god--;
      if(timer%4===0)puff(P.x+P.w/2+(Math.random()-.5)*20,P.y+18+(Math.random()-.5)*30,1,'#ffd76e',.8);
      if(P.god===120)SFX.godwarn();
      if(P.god===0)SFX.godend();
    }
    if(P.vgrabCD>0)P.vgrabCD--;
    const hang=P.vine!==null;
    if(hang)vineHold();
    P.crouch=!hang&&down()&&P.onG;
    const h=P.crouch?26:44, yOff=P.crouch?18:0;
    const spd=P.crouch?0:2.6;
    if(!hang){
    if(left()){P.vx=-spd;P.face=-1;}
    else if(right()){P.vx=spd;P.face=1;}
    else P.vx=0;
    if(jump()&&!prevJ)P.jbuf=7;
    if(P.jbuf>0)P.jbuf--;
    if(P.onG)P.coyote=7; else if(P.coyote>0)P.coyote--;
    if(P.jbuf>0&&P.coyote>0&&!P.crouch){P.vy=-8.6;P.coyote=0;P.jbuf=0;SFX.jump();puff(P.x+P.w/2,P.y+P.h,5,'#cfe6c0',1.4);}
    if(!jump()&&P.vy<-3)P.vy=-3;
    P.vy+=0.42; if(P.vy>10)P.vy=10;
    P.x+=P.vx;
    if(rectHitsSolid(P.x,P.y+yOff,P.w,h)){
      const st=P.vx?Math.sign(P.vx)*0.5:0.5;
      let it=0;
      while(rectHitsSolid(P.x,P.y+yOff,P.w,h)&&it++<90)P.x-=st;
      if(it>=90){let it2=0;while(rectHitsSolid(P.x,P.y+yOff,P.w,h)&&it2++<180)P.y-=1;}
      P.vx=0;
    }
    P.y+=P.vy;P.onG=false;
    if(rectHitsSolid(P.x,P.y+yOff,P.w,h)){
      let it=0;
      if(P.vy>0){while(rectHitsSolid(P.x,P.y+yOff,P.w,h)&&it++<120)P.y-=0.5;P.onG=true;}
      else{while(rectHitsSolid(P.x,P.y+yOff,P.w,h)&&it++<120)P.y+=0.5;}
      P.vy=0;
    }
    if(P.onG&&Math.abs(P.vx)>0&&timer%14===0)SFX.step();
    if(!P.onG&&P.vgrabCD===0)tryGrabVine();
    }
    const cx=P.x+P.w/2, feet=P.y+h+yOff-2;
    if(!hang&&(tileAt(cx,feet)===3||tileAt(cx,P.y+yOff+4)===3))killPlayer();
    if(P.y>H*TILE+80)killPlayer(),P.inv=0,P.dead=Math.max(P.dead,1);
    if(P.atk>0)P.atk--;
    if(atkKey()&&!prevA&&P.atk===0&&!P.crouch&&!hang){P.atk=22;SFX.hit();}
    if(P.atk>6&&P.atk<18){
      const hx=P.face===1?P.x+P.w:P.x-42, hb={x:hx,y:P.y-6,w:42,h:46};
      for(const e of ents){if(e.dead||e.hurt>0)continue;
        if(hb.x<e.x+e.w&&hb.x+hb.w>e.x&&hb.y<e.y+e.h&&hb.y+hb.h>e.y)hurtEnemy(e,1,P.face);}
    }
    if(dynKey()&&!prevD&&dynCount>0){
      dynCount--;SFX.throw_();
      bombs.push({x:P.x+P.w/2,y:P.y+8,vx:P.face*4.4,vy:-5,t:80});
    }
    for(const G of gems){if(G.got)continue;
      if(Math.abs(G.x-cx)<22&&Math.abs(G.y-(P.y+22))<30){G.got=true;score+=50;SFX.gem();puff(G.x,G.y,6,'#7fe0ff',1.5);}}
    for(const it of idols){if(it.got)continue;
      if(Math.abs(it.x-cx)<26&&Math.abs(it.y-(P.y+22))<34){
        it.got=true;P.god=480;score+=200;SFX.idol();
        puff(it.x,it.y,16,'#ffd76e',2.4);if(shake<6)shake=6;
      }}
    for(const p of pickups){if(p.got)continue;
      if(Math.abs(p.x-cx)<22&&Math.abs(p.y-(P.y+22))<30){p.got=true;dynCount+=2;SFX.pick();puff(p.x,p.y,6,'#ffb347',1.5);}}
    for(const c of checks){
      if(!c.on&&Math.abs(c.x-cx)<36&&Math.abs(c.y+16-(P.y+22))<84){
        c.on=true;respawn={x:c.x-11,y:c.y-44+14};
        SFX.check();puff(c.x,c.y,18,'#ffd23f',2.4);
        flash('CHECKPOINT ATTEINT','#ffd23f');
        if(shake<4)shake=4;
      }}
    if(cx>EXIT.x-6&&cx<EXIT.x+40&&P.y+22>EXIT.y-10&&!bossAlive()){score+=1000+lives*200+dynCount*100;winT=0;SFX.win();
      state=LEVEL<2?'win':'final';}
    if(!boulderDone&&P.x>BOULDER_TRIGGER){
      boulderDone=true;SFX.roar();shake=8;
      ents.push({type:'boulder',x:P.x-260,y:10*TILE,vx:1.8,vy:0,w:56,h:56,rot:0});
    }
    for(const sh of shooters){
      if(sh.cd>0){sh.cd--;continue;}
      const sx=sh.x*TILE,sy=sh.y*TILE+16;
      if(Math.abs(sy-(P.y+16))<70&&sh.dir*(P.x-sx)<0&&Math.abs(P.x-sx)<12*TILE){
        darts.push({x:sx+(sh.dir<0?-4:36),y:sy,vx:sh.dir*6});sh.cd=95;SFX.dart();
      }
    }
  }

  for(const b of bombs){
    b.vy+=0.35;b.x+=b.vx;b.y+=b.vy;b.t--;
    if(solid(tileAt(b.x,b.y+6))){b.y=Math.floor((b.y+6)/TILE)*TILE-6;b.vy*=-0.35;b.vx*=0.7;}
    if(solid(tileAt(b.x+7*Math.sign(b.vx),b.y)))b.vx*=-0.5;
    if(b.t<=0){b.boom=true;explode(b.x,b.y);}
  }
  bombs=bombs.filter(b=>!b.boom);

  for(const d of darts){d.x+=d.vx;
    if(solid(tileAt(d.x,d.y)))d.dead=true;
    if(P.dead===0&&Math.abs(d.x-(P.x+P.w/2))<14){
      const ph=P.crouch?26:44,py=P.y+(P.crouch?18:0);
      if(d.y>py&&d.y<py+ph){d.dead=true;killPlayer();}
    }}
  darts=darts.filter(d=>!d.dead&&d.x>cam.x-60&&d.x<cam.x+VW+60);

  for(const e of ents){
    if(e.dead)continue;
    if(e.hurt>0)e.hurt--;
    e.f+=0.15;
    if(e.type==='raptor'){
      e.vy+=0.42;e.y+=e.vy;
      if(rectHitsSolid(e.x,e.y,e.w,e.h)){let it=0;while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<120)e.y-=0.5;e.vy=0;}
      const chase=Math.abs(P.x-e.x)<230&&Math.abs(P.y-e.y)<80&&P.dead===0;
      const sp=chase?1.9:1.1;
      if(e.hurt===0)e.vx=Math.sign(chase?(P.x-e.x):(e.vx||1))*sp||sp;
      e.x+=e.vx;
      const ahead=e.x+(e.vx>0?e.w+2:-2);
      if(rectHitsSolid(ahead,e.y,2,e.h)||!solid(tileAt(ahead,e.y+e.h+6))){e.x-=e.vx;e.vx*=-1;}
      if(!chase&&Math.abs(e.x-e.ox)>(e.r||100)){e.vx=Math.sign(e.ox-e.x)*sp;}
    }
    if(e.type==='ptero'){
      e.y=e.oy+Math.sin(e.f*0.9+e.ph)*46;
      e.x+=Math.cos(e.f*0.45+e.ph)*1.6;
    }
    if(e.type==='baby'){
      e.vy+=0.42;e.y+=e.vy;
      if(rectHitsSolid(e.x,e.y,e.w,e.h)){
        let it=0;while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<140)e.y-=0.5;
        e.vy=0;e.onG=true;
      }else e.onG=false;
      const dx=(P.x+11)-(e.x+e.w/2), dist=Math.abs(dx);
      if(!e.woke&&dist<440&&P.dead===0){
        e.woke=true;SFX.babyCry();shake=10;setTrack('boss');
      }
      if(e.woke&&P.dead===0){
        e.face=dx>=0?1:-1;
        if(!e.rage&&e.hp<=4){                 /* seconde phase : il s'énerve */
          e.rage=true;e.mode=0;e.mt=40;
          SFX.babyRage();shake=16;
          puff(e.x+e.w/2,e.y+10,22,'#e8452c',3);
        }
        const spd=e.rage?(1.9+e.hard*.5):(1.1+e.hard*.3);
        e.mt--;
        if(e.mode===0){                        /* il trottine vers Sam */
          if(e.onG){e.vx=Math.sign(dx)*spd;e.x+=e.vx;
            if(rectHitsSolid(e.x,e.y,e.w,e.h)){
              const st=e.vx?Math.sign(e.vx)*.5:.5;let it=0;
              while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<140)e.x-=st;}}
          if(e.mt<=0){
            const r=Math.random();
            if(dist<150&&r<.45)e.mode=3;        /* saut par-dessus l'héroïne */
            else if(r<.6)e.mode=2;              /* jet de tétine */
            else e.mode=1;                      /* crise de larmes */
            e.mt=e.mode===1?(e.rage?52:40):(e.rage?26:38);
            if(e.mode===3&&e.onG){
              e.vy=-11.5;e.vx=Math.sign(dx)*(e.rage?3.4:2.6);
              SFX.babyJump();
            }
            if(e.mode===2){
              const sp=e.rage?7.2:5.8;
              bprojs.push({kind:'teddy',x:e.x+e.w/2,y:e.y+34,
                vx:Math.sign(dx)*sp,vy:-4.4,rot:0,t:230,bounces:0,rage:e.rage});
              SFX.babyThrow();
            }
          }
        }
        if(e.mode===1){                        /* il pleure : les larmes blessent */
          e.cry=1;
          const every=e.rage?9:15;
          if(e.mt%every===0){
            for(let k=-1;k<=1;k+=2){
              bprojs.push({kind:'tear',x:e.x+e.w/2+k*16,y:e.y+30,
                vx:k*(1.1+Math.random()*1.5)+(e.rage?Math.sign(dx)*1.4:0),
                vy:-2.2-Math.random()*1.6,t:180});
            }
            if(e.mt%(every*2)===0)SFX.babyTear();
          }
          if(e.mt<=0){e.cry=0;e.mode=0;e.mt=e.rage?34:52;}
        }else e.cry=0;
        if(e.mode===2&&e.mt<=0){e.mode=0;e.mt=e.rage?26:44;}
        if(e.mode===3){                        /* en l'air */
          e.x+=e.vx;
          if(rectHitsSolid(e.x,e.y,e.w,e.h)){
            const st=e.vx?Math.sign(e.vx)*.5:.5;let it=0;
            while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<140)e.x-=st;e.vx*=-.5;}
          if(e.onG&&e.vy===0){
            e.mode=0;e.mt=e.rage?24:40;shake=Math.max(shake,7);
            SFX.babyLand();puff(e.x+e.w/2,e.y+e.h,10,'#cfe6c0',2);
          }
        }
      }
      e.f+=0.12;
    }
    if(e.type==='stego'){
      e.vy+=0.42;e.y+=e.vy;
      if(rectHitsSolid(e.x,e.y,e.w,e.h)){let it=0;while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<120)e.y-=0.5;e.vy=0;}
      e.x+=e.vx;
      const ahead=e.x+(e.vx>0?e.w+2:-2);
      if(rectHitsSolid(ahead,e.y,2,e.h)||!solid(tileAt(ahead,e.y+e.h+6))){e.x-=e.vx;e.vx*=-1;}
    }
    if(e.type==='bat'){
      if(e.cd>0)e.cd--;
      if(!e.dive&&e.cd===0&&P.dead===0&&Math.abs(P.x+11-e.x)<105&&P.y>e.y+20){
        e.dive=3;e.warn=20;                      /* avertissement avant le plongeon */
      }
      if(e.dive===3){
        e.warn--;e.y+=Math.sin(timer*.8)*.6;
        if(e.warn<=0)e.dive=1;
      }else if(e.dive===1){
        e.x+=Math.sign(P.x-e.x)*1.5;e.y+=1.7;
        if(e.y>e.oy+150||solid(tileAt(e.x,e.y+e.h+4)))e.dive=2;
      }else if(e.dive===2){
        e.y-=1.6;if(e.y<=e.oy){e.y=e.oy;e.dive=0;e.cd=70;}
      }else{
        e.y=e.oy+Math.sin(e.f*1.5+e.ph)*16;
        e.x=e.ox+Math.sin(e.f*.45+e.ph)*70;
      }
    }
    if(e.type==='trex'||e.type==='spino'){
      e.vy+=0.42;e.y+=e.vy;
      if(rectHitsSolid(e.x,e.y,e.w,e.h)){let it=0;while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<120)e.y-=0.5;e.vy=0;}
      const dx=P.x-e.x, dist=Math.abs(dx);
      if(!e.roared&&dist<430){e.roared=true;SFX.roar();shake=12;setTrack('boss');}
      if(e.roared&&P.dead===0&&e.hurt===0){
        const fast=e.type==='spino';
        const sp=dist<200?(fast?2.9:2.4):(fast?1.6:1.2);
        e.vx=Math.sign(dx)*sp;e.x+=e.vx;
        if(rectHitsSolid(e.x,e.y,e.w,e.h)){const st=e.vx?Math.sign(e.vx)*0.5:0.5;
          let it=0;while(rectHitsSolid(e.x,e.y,e.w,e.h)&&it++<120)e.x-=st;}
      }
    }
    if(e.type==='boulder'){
      e.vx=Math.min(e.vx+0.018,3.2);e.vy+=0.42;
      e.x+=e.vx;e.y+=e.vy;e.rot+=e.vx*0.05;
      if(rectHitsSolid(e.x+8,e.y,e.w-16,e.h)){let it=0;
        while(rectHitsSolid(e.x+8,e.y,e.w-16,e.h)&&it++<120)e.y-=0.5;e.vy=0;}
      const prox=P.x-(e.x+e.w);
      if(prox<340&&prox>-60&&P.dead===0){
        const f=1-Math.max(0,prox)/340;
        if(shake<f*5)shake=f*5;                      /* le sol tremble de plus en plus */
        if(timer%Math.max(3,Math.round(10-f*7))===0)
          puff(e.x+e.w/2,e.y+e.h,3,'#b9a98c',1.5+f*2);
        if(timer%22===0)sn(.18,.05+f*.13,'lowpass',260+f*220,.8);
      }else if(timer%9===0)puff(e.x+e.w/2,e.y+e.h,3,'#b9a98c',1.5);
      if(e.y>H*TILE+100)e.dead=true;
    }
    if(P.dead===0&&P.inv===0){
      const m=6, ph=P.crouch?26:44,py=P.y+(P.crouch?18:0);
      if(P.x+m<e.x+e.w&&P.x+P.w-m>e.x&&py+m<e.y+e.h&&py+ph-m>e.y){
        if(P.god>0){
          /* intouchable : elle traverse les gros, elle pulvérise les petits */
          if(e.type!=='trex'&&e.type!=='spino'&&e.type!=='boulder'&&e.hurt===0)
            hurtEnemy(e,99,Math.sign((e.x+e.w/2)-(P.x+P.w/2)));
        }else killPlayer();
      }
    }
  }
  ents=ents.filter(e=>!e.dead);

  idleVines();updateStals();updateBprojs();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;}
  parts=parts.filter(p=>p.life>0);

  const tx=P.x+P.w/2-VW/2+P.face*90;
  cam.x+=(tx-cam.x)*0.08;
  cam.x=Math.max(0,Math.min(cam.x,W*TILE-VW));
  cam.y=0;
}

/* ============================================================
   RENDU 16-BIT
   ============================================================ */
let TC=ctx;
function px(x,y,w,h,c){TC.fillStyle=c;TC.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}

/* --- système de contours (outline) via canvas hors-écran --- */
function mkOS(w,h){try{
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');if(!x)return[null,null];
  x.imageSmoothingEnabled=false;return[c,x];
}catch(e){return[null,null];}}
const [O1,o1]=mkOS(300,240),[O2,o2]=mkOS(300,240);
const OCX=150,OCY=76;
const CAN_OUTLINE=!!(O1&&o1&&O2&&o2);
function outlined(x,y,fn,col='#241f1a'){
  if(!CAN_OUTLINE){ /* repli : dessin direct, sans contour */
    ctx.save();ctx.translate(Math.round(x),Math.round(y));fn();ctx.restore();return;
  }
  o1.setTransform(1,0,0,1,0,0);o1.clearRect(0,0,300,240);
  TC=o1;o1.save();o1.translate(OCX,OCY);fn();o1.restore();TC=ctx;
  o2.setTransform(1,0,0,1,0,0);o2.clearRect(0,0,300,240);
  o2.drawImage(O1,0,0);
  o2.globalCompositeOperation='source-in';
  o2.fillStyle=col;o2.fillRect(0,0,300,240);
  o2.globalCompositeOperation='source-over';
  const X=Math.round(x-OCX),Y=Math.round(y-OCY);
  ctx.drawImage(O2,X-2,Y);ctx.drawImage(O2,X+2,Y);
  ctx.drawImage(O2,X,Y-2);ctx.drawImage(O2,X,Y+2);
  ctx.drawImage(O1,X,Y);
}
function shadow(x,y,w){
  ctx.fillStyle='rgba(12,26,14,.3)';
  ctx.beginPath();ctx.ellipse(x,y,w/2,5,0,0,7);ctx.fill();
}
/* trouve le sol sous un point (pour poser les ombres) */
function groundY(px_,py_){
  let ty=Math.max(0,Math.floor(py_/TILE));
  const tx=Math.floor(px_/TILE);
  for(;ty<H;ty++){if(tx>=0&&tx<W&&solid(g[ty][tx]))return ty*TILE;}
  return H*TILE+60;
}

const CH={dread:'#7e1a1c',dread2:'#b52a24',dread3:'#e04a38',band:'#5a0f12',

function drawHeroBody(){
  const u=2, f=P.face, t=timer;
  TC.scale(f,1);TC.translate(-14,0);

function drawTiles(){
  const x0=Math.floor(cam.x/TILE),x1=Math.min(W-1,x0+Math.ceil(VW/TILE)+1);
  for(let ty=0;ty<H;ty++)for(let tx=x0;tx<=x1;tx++){
    const t=g[ty][tx];if(!t)continue;
    const sx=tx*TILE-cam.x, sy=ty*TILE;
    if(t===1){
      const expT=emptyAt(tx,ty-1),expL=emptyAt(tx-1,ty),expR=emptyAt(tx+1,ty),expB=emptyAt(tx,ty+1);
      const TH=THEME;
      ctx.fillStyle=TH.dirt;ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle=TH.dirt2;
      if(seeded(tx*31+ty*7)>.45)ctx.fillRect(sx+5,sy+11,9,6);
      if(seeded(tx*13+ty*17)>.45)ctx.fillRect(sx+19,sy+21,8,5);
      ctx.fillStyle=TH.dirt3;
      if(seeded(tx*7+ty*23)>.5)ctx.fillRect(sx+16,sy+7,6,4);
      if(seeded(tx*41+ty*3)>.7){
        ctx.fillStyle='#8d8272';ctx.fillRect(sx+8,sy+18,7,5);
        ctx.fillStyle='#a89c88';ctx.fillRect(sx+9,sy+18,5,2);}
      /* bords latéraux ombrés */
      if(expL){ctx.fillStyle=TH.edge;ctx.fillRect(sx,sy,3,TILE);}
      if(expR){ctx.fillStyle=TH.edge;ctx.fillRect(sx+TILE-3,sy,3,TILE);}
      if(expB){ctx.fillStyle=TH.bot;ctx.fillRect(sx,sy+TILE-3,TILE,3);
        /* lianes qui pendent sous les plateformes */
        if(seeded(tx*9.7)>.62){
          const len=18+seeded(tx*3.3)*40, sway=Math.sin(timer*0.04+tx)*2;
          ctx.fillStyle='#3a7048';
          for(let vy=0;vy<len;vy+=6)ctx.fillRect(sx+10+sway*(vy/len),sy+TILE+vy,3,6);
          ctx.fillStyle='#55a060';
          ctx.fillRect(sx+7+sway,sy+TILE+len*0.5,4,3);
          ctx.fillRect(sx+13+sway,sy+TILE+len-4,4,3);
        }}
      /* couvert d'herbe */
      if(expT){
        ctx.fillStyle=TH.capA;ctx.fillRect(sx,sy,TILE,10);
        ctx.fillStyle=TH.capB;ctx.fillRect(sx,sy,TILE,7);
        ctx.fillStyle=TH.capC;ctx.fillRect(sx,sy,TILE,3);
        ctx.fillStyle=TH.capD;ctx.fillRect(sx,sy+10,TILE,2);
        /* brins d'herbe */
        if(!TH.cave){
          ctx.fillStyle='#6fcf5e';
          for(let b=0;b<3;b++){const bx=sx+3+b*10+seeded(tx*5+b)*4;
            ctx.fillRect(bx,sy-5,2,6);ctx.fillRect(bx+3,sy-3,2,4);}
        }else{
          /* petits cristaux au lieu des brins d'herbe */
          for(let b=0;b<2;b++){
            const bx=sx+7+b*14+seeded(tx*5+b)*4, hh=5+seeded(tx*3+b)*6;
            ctx.fillStyle='#6b4f9e';
            ctx.beginPath();ctx.moveTo(bx,sy-hh);ctx.lineTo(bx+4,sy);ctx.lineTo(bx-4,sy);ctx.fill();
            ctx.fillStyle='#c9a8f5';ctx.fillRect(bx-1,sy-hh+2,2,hh-3);
          }
        }
        /* fleurs */
        const fs=seeded(tx*17.3);
        if(fs>.78){
          const fx=sx+8+seeded(tx*29)*14;
          ctx.fillStyle='#3a7048';ctx.fillRect(fx+1,sy-6,2,7);
          ctx.fillStyle=fs>.92?'#ff8fb0':(fs>.85?'#ffd23f':'#ff6b5e');
          ctx.fillRect(fx-2,sy-10,3,3);ctx.fillRect(fx+3,sy-10,3,3);
          ctx.fillRect(fx-2,sy-6,3,3);ctx.fillRect(fx+3,sy-6,3,3);
          ctx.fillStyle='#fff8d8';ctx.fillRect(fx+1,sy-8,2,2);
        }
      }
    }
    if(t===3){
      ctx.fillStyle='#8d939c';ctx.fillRect(sx,sy+TILE-6,TILE,6);
      ctx.fillStyle='#5d646f';ctx.fillRect(sx,sy+TILE-2,TILE,2);

        ctx.fillStyle='#aab4bf';ctx.beginPath();
        ctx.moveTo(sx+s*8,sy+TILE-4);ctx.lineTo(sx+s*8+4,sy+8);ctx.lineTo(sx+s*8+8,sy+TILE-4);ctx.fill();
        ctx.fillStyle='#e2e8ee';ctx.beginPath();
        ctx.moveTo(sx+s*8+3,sy+TILE-4);ctx.lineTo(sx+s*8+4,sy+10);ctx.lineTo(sx+s*8+5,sy+TILE-4);ctx.fill();}

      ctx.strokeStyle='#4e4231';ctx.lineWidth=2;
      ctx.strokeRect(sx+1,sy+1,TILE-2,TILE-2);
      ctx.beginPath();ctx.moveTo(sx+6,sy+4);ctx.lineTo(sx+16,sy+16);ctx.lineTo(sx+10,sy+28);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+24,sy+6);ctx.lineTo(sx+18,sy+18);ctx.stroke();
      /* mousse */
      ctx.fillStyle='#55a060';ctx.fillRect(sx,sy,8,3);ctx.fillRect(sx+22,sy,10,3);

    if(t===5){
      const locked=bossAlive();

      ctx.fillStyle='#9a8a6c';ctx.fillRect(sx-8,sy-4,TILE+16,TILE+4);
      ctx.fillStyle='#b4a582';ctx.fillRect(sx-8,sy-4,TILE+16,4);
      ctx.fillStyle='#1c1610';ctx.fillRect(sx+2,sy+2,TILE-4,TILE-2);
      const gl=.25+Math.sin(timer*0.06)*.15;
      ctx.fillStyle=locked?`rgba(220,80,60,${gl})`:`rgba(120,220,160,${gl})`;
      ctx.fillRect(sx+4,sy+4,TILE-8,TILE-6);
      if(locked){                       /* barreaux tant que le bébé tient debout */
        ctx.fillStyle='#8d939c';
        ctx.fillRect(sx+5,sy+2,4,TILE-4);ctx.fillRect(sx+14,sy+2,4,TILE-4);
        ctx.fillRect(sx+23,sy+2,4,TILE-4);
      }
      if(ty*TILE===EXIT.y){
        ctx.fillStyle='#d8b96a';ctx.fillRect(sx-8,sy-10,TILE+16,7);
        ctx.fillStyle='#f0d88a';ctx.fillRect(sx-8,sy-10,TILE+16,2);
        ctx.fillStyle='#55a060';ctx.fillRect(sx-8,sy-10,7,4);ctx.fillRect(sx+28,sy-8,9,4);
        ctx.font='bold 11px monospace';
        ctx.fillStyle='#241f1a';ctx.fillText(locked?'VERROUILLÉ':'SORTIE',sx-16,sy-14);
        ctx.fillStyle=locked?'#e8452c':'#ffd23f';
        ctx.fillText(locked?'VERROUILLÉ':'SORTIE',sx-17,sy-15);
      }
    }
  }
  for(const sh of shooters){
    const sx=sh.x*TILE-cam.x,sy=sh.y*TILE;
    ctx.fillStyle='#241f1a';ctx.fillRect(sx+15,sy+4,18,24);
    ctx.fillStyle='#7c6f60';ctx.fillRect(sx+17,sy+6,14,20);
    ctx.fillStyle='#948676';ctx.fillRect(sx+17,sy+6,14,4);
    ctx.fillStyle='#1c1610';ctx.fillRect(sx+15,sy+12,6,8);
    ctx.fillStyle='#55a060';ctx.fillRect(sx+24,sy+4,7,3);
  }
  for(const c of checks){
    const sx=c.x-cam.x, sy=c.y+16;
    ctx.fillStyle='#241f1a';ctx.fillRect(sx-4,sy-1,8,34);
    ctx.fillStyle='#7a4b26';ctx.fillRect(sx-3,sy,6,32);
    ctx.fillStyle='#9a6636';ctx.fillRect(sx-3,sy,2,32);

      ctx.fillStyle='rgba(255,170,60,.10)';ctx.beginPath();ctx.arc(sx,sy-10,62,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,190,80,.16)';ctx.beginPath();ctx.arc(sx,sy-8,36,0,7);ctx.fill();
      /* fanion : on voit de loin qu'il est validé */
      ctx.fillStyle='#241f1a';ctx.fillRect(sx+2,sy-30,20,13);
      ctx.fillStyle='#e8452c';ctx.fillRect(sx+3,sy-29,18,11);
      ctx.fillStyle='#ff9a80';ctx.fillRect(sx+3,sy-29,18,3);
      /* étincelles qui montent */
      for(let k=0;k<3;k++){
        const t=(timer*1.6+k*40)%80;
        ctx.fillStyle='rgba(255,214,110,'+(1-t/80)+')';
        ctx.fillRect(sx-6+((k*7)%13)+Math.sin(t*.12)*4,sy-12-t*.55,3,3);

    ctx.fillStyle=`rgba(232,69,44,${fl})`;ctx.beginPath();ctx.arc(sx,sy-5+ff*0.3,bh,0,7);ctx.fill();
    ctx.fillStyle=`rgba(255,150,40,${fl})`;ctx.beginPath();ctx.arc(sx,sy-8+ff*0.3,bh*.66,0,7);ctx.fill();
    ctx.fillStyle=`rgba(255,230,120,${fl})`;ctx.beginPath();ctx.arc(sx,sy-11+ff*0.3,bh*.36,0,7);ctx.fill();
  }
}

    ctx.fillStyle='#241f1a';ctx.fillRect(ax-24,ay-12,48,12);
    ctx.fillStyle='#5c4327';ctx.fillRect(ax-22,ay-10,44,8);
    ctx.fillStyle='#7d5a34';ctx.fillRect(ax-22,ay-10,44,3);
    ctx.fillStyle='#3a7048';ctx.fillRect(ax-26,ay-14,12,5);ctx.fillRect(ax+14,ay-13,12,5);
    /* corde : la traîne se courbe un peu vers l'ancre */
    const n=Math.max(6,Math.round(v.L/11));
    for(let i=0;i<=n;i++){
      const t=i/n, l=v.L*t, th=v.th*(.72+.28*t);
      const x=ax+Math.sin(th)*l, y=ay+Math.cos(th)*l;
      ctx.fillStyle=(i%2)?'#3a7048':'#2d5c3a';
      ctx.fillRect(x-3,y-1,6,8);
      if(i%3===0){ctx.fillStyle='#55a060';
        ctx.fillRect(x+(i%2?4:-9),y+1,6,4);ctx.fillRect(x+(i%2?7:-11),y+3,3,3);}
    }
    /* bouquet terminal */
    const ex=ax+Math.sin(v.th)*v.L, ey=ay+Math.cos(v.th)*v.L;
    ctx.fillStyle='#2d5c3a';ctx.fillRect(ex-8,ey+1,16,6);
    ctx.fillStyle='#55a060';ctx.fillRect(ex-6,ey+2,12,4);ctx.fillRect(ex-3,ey+6,6,4);
    ctx.fillStyle='#8ee06a';ctx.fillRect(ex-5,ey+2,4,2);
  }
}

function drawShafts(){
  if(THEME&&THEME.cave)return;
  ctx.save();
  for(let i=0;i<4;i++){
    const bx=i*300-((cam.x*0.1)%300)+Math.sin(timer*0.008+i)*14;
    const grd=ctx.createLinearGradient(bx,0,bx-120,VH);
    grd.addColorStop(0,'rgba(255,246,190,.13)');grd.addColorStop(1,'rgba(255,246,190,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+64,0);
    ctx.lineTo(bx-70,VH);ctx.lineTo(bx-150,VH);ctx.fill();
  }
  ctx.restore();
}
function drawAmbient(){
  for(const a of ambient){
    a.ph+=0.02;
    let ax=((a.x-cam.x*0.85)%(VW+120)+VW+120)%(VW+120)-60;
    if(THEME&&THEME.cave){
      /* gouttes et poussière minérale */
      if(a.type===1){
        a.y+=a.sp*2.2;if(a.y>VH)a.y=-10;
        ctx.fillStyle='rgba(150,190,240,.55)';ctx.fillRect(ax,a.y,2,7);
      }else{
        const ay=a.y+Math.sin(a.ph*1.2)*10;
        ctx.fillStyle='rgba(190,160,240,'+(.2+Math.sin(a.ph*2)*.15)+')';
        ctx.fillRect(ax,ay,2,2);
      }
      continue;
    }
    if(a.type===0){ /* luciole */
      const ay=a.y+Math.sin(a.ph*1.6)*18;
      const gl=.4+Math.sin(a.ph*3)*.35;
      ctx.fillStyle=`rgba(255,236,150,${gl*.35})`;ctx.beginPath();ctx.arc(ax,ay,5,0,7);ctx.fill();
      ctx.fillStyle=`rgba(255,246,200,${gl})`;ctx.fillRect(ax-1,ay-1,3,3);
    }else if(a.type===1){ /* feuille qui tombe */
      a.y+=a.sp; a.x+=Math.sin(a.ph)*0.6;
      if(a.y>VH+10)a.y=-10;
      ctx.save();ctx.translate(ax,a.y);ctx.rotate(Math.sin(a.ph*1.3)*.8);
      ctx.fillStyle='#55a060';ctx.fillRect(-3,-2,7,4);
      ctx.fillStyle='#3a7048';ctx.fillRect(-3,1,7,1);
      ctx.restore();
    }else{ /* spore/pollen */
      const ay=(a.y+timer*a.sp*0.3)%VH;
      ctx.fillStyle='rgba(240,250,220,.4)';ctx.fillRect(ax,ay,2,2);
    }
  }
}
function drawForeground(){
  if(THEME&&THEME.cave){
    ctx.fillStyle='#150f1f';
    for(let i=-1;i<14;i++){
      const seed=Math.floor((cam.x*1.25)/96)+i, bx=i*96-((cam.x*1.25)%96);
      const h=18+seeded(seed)*26;
      ctx.beginPath();ctx.moveTo(bx-22,VH);ctx.lineTo(bx-6,VH-h-10);ctx.lineTo(bx+10,VH);ctx.fill();
      ctx.beginPath();ctx.moveTo(bx-18,0);ctx.lineTo(bx-4,h+14);ctx.lineTo(bx+12,0);ctx.fill();
    }
    ctx.fillRect(0,VH-5,VW,5);
    return;
  }
  /* frondaisons sombres en bas d'écran, parallaxe rapide */
  ctx.fillStyle='#1c3a26';
  for(let i=-1;i<14;i++){
    const seed=Math.floor((cam.x*1.25)/96)+i;
    const bx=i*96-((cam.x*1.25)%96);
    const h=14+seeded(seed)*22;
    ctx.beginPath();ctx.arc(bx,VH+16,h+18,0,7);ctx.fill();
    /* feuilles pointues */
    ctx.beginPath();ctx.moveTo(bx-20,VH);ctx.lineTo(bx-6,VH-h-8);ctx.lineTo(bx+8,VH);ctx.fill();
  }
  ctx.fillRect(0,VH-6,VW,6);
}

/* ---------- BOUCLE ---------- */
let acc=0,last=performance.now(),rafOK=false,timerMode=false;
function hideBoot(){
  const b=document.getElementById('boot');
  if(b&&b.style.display!=='none')b.style.display='none';
}
function step(now){
  if(ERRSHOWN)return false;
  try{
    acc+=Math.min(now-last,100);last=now;
    let guard=0;
    while(acc>=1000/60&&guard++<8){
      update();
      prevJ=jump();prevA=atkKey();prevD=dynKey();prevS=relKey();
      acc-=1000/60;
    }
    if(guard>=8)acc=0;
    draw();
    musicTick();
    hideBoot();
  }catch(e){fail('boucle de jeu (frame '+timer+')',e);return false;}
  return true;
}
function loop(now){
  rafOK=true;
  if(step(typeof now==='number'?now:performance.now()))requestAnimationFrame(loop);
}
try{
  if(ctx){
    newGame();state='title';setTrack('title');
    step(performance.now());        /* première image dessinée tout de suite */
    requestAnimationFrame(loop);
    /* certains navigateurs en cadre isolé ne déclenchent jamais requestAnimationFrame :
       au bout de 700 ms sans réponse, on bascule sur une minuterie classique */
    setTimeout(function(){
      if(!rafOK&&!timerMode&&!ERRSHOWN){
        timerMode=true;last=performance.now();
        setInterval(function(){if(!ERRSHOWN)step(performance.now());},16);
      }
    },700);
  }
}catch(e){ fail('initialisation',e); }

/* ---------- MANETTE (version compacte) ---------- */
document.head.insertAdjacentHTML('beforeend','<style>body.pad .tbtn{display:none}</style>');
(function(){
  var on=false;
  setInterval(function(){
    var l=navigator.getGamepads?navigator.getGamepads():[],g=null,i;
    for(i=0;i<l.length;i++){ if(l[i]){ g=l[i]; break; } }
    if(!g){ if(on){ on=false; document.body.classList.remove('pad'); } return; }
    if(!on){ on=true; document.body.classList.add('pad'); audio(); flash('MANETTE CONNECTEE','#7fe0ff'); }
    var b=function(n){ var x=g.buttons[n]; return !!x&&(x.pressed||x.value>0.5); };
    var ax=g.axes[0]||0, ay=g.axes[1]||0;
    K['arrowleft']  = b(14)||ax<-0.4;
    K['arrowright'] = b(15)||ax> 0.4;
    K['arrowdown']  = b(13)||ay> 0.4;
    K['u']          = b(12)||ay<-0.4;
    K[' ']          = b(0);
    K['x']          = b(2)||b(3)||b(5)||b(7);
    K['c']          = b(1)||b(4)||b(6);
    if((b(0)||b(9))&&state!=='play') advance();
  },16);
})();
